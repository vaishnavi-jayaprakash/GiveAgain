services:
  postgres:
    image: postgres:16

    container_name: giveagain-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: vaishu
      POSTGRES_PASSWORD: vaishu@123
      POSTGRES_DB: giveagain

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: